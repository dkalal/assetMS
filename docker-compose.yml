services:
  db:
    image: postgres:16-alpine
    container_name: assetms_db
    environment:
      POSTGRES_DB: assetms
      POSTGRES_USER: assetms
      POSTGRES_PASSWORD: assetms_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetms"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - assetms_net
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assetms_web
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn assetms.wsgi:application --bind 0.0.0.0:8001 --workers 3"
    env_file:
      - .env
    environment:
      DEBUG: "False"
      DATABASE_URL: postgresql://assetms:assetms_dev_password@db:5432/assetms
      SECRET_KEY: django-insecure-dev-key-change-in-production-min-50-chars-length
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-10.10.10.254,localhost,127.0.0.1,assetms_web}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://10.10.10.254:8001,http://localhost:8001,http://127.0.0.1:8001}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
    volumes:
      - ./:/app
      - static_data:/app/staticfiles
      - media_data:/app/media
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - assetms_net
    restart: unless-stopped

volumes:
  postgres_data:
  static_data:
  media_data:

networks:
  assetms_net:
    driver: bridge
