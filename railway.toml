[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "gunicorn assetms.wsgi:application --bind 0.0.0.0:$PORT --workers 4"

[phases.setup]
nixPkgs = [
  "glib",
  "cairo",
  "pango",
  "gdk-pixbuf",
  "harfbuzz",
  "freetype",
  "fontconfig",
  "libffi"
]

[variables]
PYTHONUNBUFFERED = "1"
