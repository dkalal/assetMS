version: '3.9'

services:
  # PostgreSQL database service
  db:
    image: postgres:15-alpine
    container_name: assetms_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-assetms_prod}
      POSTGRES_USER: ${DB_USER:-assetms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-assetms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - assetms_network

  # Redis for caching and Celery broker
  redis:
    image: redis:7-alpine
    container_name: assetms_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - assetms_network

  # Django web application service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assetms_web_prod
    restart: unless-stopped
    environment:
      # Database configuration
      DATABASE_URL: postgresql://${DB_USER:-assetms}:${DB_PASSWORD:-change-me}@db:5432/${DB_NAME:-assetms_prod}
      
      # Django core settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://10.10.10.254:8001}
      
      # Server configuration
      PORT: 8001
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      
      # Redis/Celery configuration
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
      
      # Storage backend selection
      USE_CLOUDINARY: ${USE_CLOUDINARY:-False}
      USE_IMAGEKIT: ${USE_IMAGEKIT:-False}
      USE_B2: ${USE_B2:-False}
      
      # Cloudinary configuration
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      
      # Email configuration
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@example.com}
      
      # Security settings
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-True}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-True}
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    
    networks:
      - assetms_network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery worker for async tasks
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assetms_celery_worker
    restart: unless-stopped
    command: celery -A assetms worker --loglevel=info --concurrency=4
    environment:
      # Database configuration
      DATABASE_URL: postgresql://${DB_USER:-assetms}:${DB_PASSWORD:-change-me}@db:5432/${DB_NAME:-assetms_prod}
      
      # Django settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      
      # Redis/Celery configuration
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    volumes:
      - media_data:/app/media
    
    networks:
      - assetms_network
    
    healthcheck:
      test: ["CMD", "celery", "-A", "assetms", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery beat for periodic tasks
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assetms_celery_beat
    restart: unless-stopped
    command: celery -A assetms beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      # Database configuration
      DATABASE_URL: postgresql://${DB_USER:-assetms}:${DB_PASSWORD:-change-me}@db:5432/${DB_NAME:-assetms_prod}
      
      # Django settings
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      
      # Redis/Celery configuration
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    networks:
      - assetms_network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: assetms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      - web
    networks:
      - assetms_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

# Named volumes for persistent data
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local

# Custom network for service isolation
networks:
  assetms_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
