name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Django checks
        run: |
          python manage.py check --deploy --fail-level WARNING || true

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: assetms.settings
          # Provide minimal env; override in repository secrets as needed
          SECRET_KEY: dummy-ci-key
          DEBUG: 'False'
        run: |
          pytest -q
