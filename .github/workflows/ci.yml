name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: assetms_test
          POSTGRES_USER: assetms
          POSTGRES_PASSWORD: assetms_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assetms -d assetms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: assetms.settings
      SECRET_KEY: ci-only-7e8d91f4c2a64b3fa58d13be6c39024d-not-production
      DJANGO_DEBUG: 'False'
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DATABASE_URL: postgresql://assetms:assetms_test_password@127.0.0.1:5432/assetms_test
      DB_SSL: 'False'
      SECURE_SSL_REDIRECT: 'False'
      USE_CLOUDINARY: 'False'
      USE_IMAGEKIT: 'False'
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Django system and migration checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          SECURE_SSL_REDIRECT=True python manage.py check --deploy --fail-level WARNING

      - name: Run tests
        run: |
          pytest -q
