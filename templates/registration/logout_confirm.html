{% extends 'base_auth.html' %}
{% block title %}Sign out · AssetPro{% endblock %}
{% block content %}
<section class="card" aria-labelledby="logout-title">
  <div class="card-body text-center">
    <i class="bi bi-box-arrow-right auth-icon" aria-hidden="true"></i>
    <h1 id="logout-title" class="h4 mt-3">Sign out?</h1>
    <p class="text-muted">You will need to sign in again to access the asset workspace.</p>
    <form action="{% url 'users:logout' %}" method="post" class="d-grid gap-2">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary">Sign out</button>
      <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Return to dashboard</a>
    </form>
  </div>
</section>
{% endblock %}
