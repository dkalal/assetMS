{% extends "base.html" %}
{% block title %}Password Reset Complete - Asset Management{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-success text-white text-center py-4">
          <h2 class="mb-0"><i class="bi bi-check-circle me-2"></i>Password reset complete</h2>
        </div>
        <div class="card-body p-4 text-center">
          <p class="lead mb-3">Your password has been updated successfully.</p>
          <p class="text-muted">You can now sign in with your new credentials.</p>
          <div class="mt-4">
            <a class="btn btn-primary" href="{% url 'users:login' %}">
              <i class="bi bi-box-arrow-in-right me-2"></i>Back to login
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
