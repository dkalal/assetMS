[pytest]
# Django settings module
DJANGO_SETTINGS_MODULE = assetms.settings

# Python files to search for tests
python_files = test_*.py *_test.py *_tests.py

# Python classes to search for tests
python_classes = Test* *Tests *TestCase

# Python functions to search for tests
python_functions = test_*

# Test discovery patterns
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, database)
    performance: Performance and load tests
    accessibility: Accessibility and WCAG compliance tests
    security: Security and penetration tests
    slow: Tests that take significant time
    smoke: Critical smoke tests for quick validation
    regression: Regression tests for bug fixes
    multi_tenancy: Multi-tenancy isolation tests
    e2e: End-to-end workflow tests
    
# Output options
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --reuse-db
    --nomigrations
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --maxfail=5
    -p no:warnings
    
# Coverage settings
[coverage:run]
source = .
omit = 
    */migrations/*
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    manage.py
    assetms/wsgi.py
    assetms/asgi.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
